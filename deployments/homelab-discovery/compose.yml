services:
  homarr:
    # Verified CI image (run 40416426466, commit 0c0f9b76f). Override HOMARR_IMAGE in .env to use another build.
    image: "${HOMARR_IMAGE:-ghcr.io/socilate47/my-homarr@sha256:ce6d7fb398c01b9eb7e6c308906e192e663891abc3f303da693cb91a4c477528}"
    restart: unless-stopped
    init: true
    ports:
      - "${HOMARR_PORT:-7575}:7575"
    environment:
      SECRET_ENCRYPTION_KEY: "${SECRET_ENCRYPTION_KEY:?Run setup.sh to create the persistent encryption key}"
      TZ: "${TZ:-Etc/UTC}"
    volumes:
      - homarr-data:/appdata
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7575').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

volumes:
  homarr-data:
