services:
  homarr:
    # Verified CI image (run 40414536701, commit b6670cd95). Override HOMARR_IMAGE in .env to use another build.
    image: "${HOMARR_IMAGE:-ghcr.io/socilate47/my-homarr@sha256:df296e0c5b6f4882da7f0f7a33fe1c3e2390640c98564e9f3910ad377ec33fe4}"
    restart: unless-stopped
    init: true
    ports:
      - "${HOMARR_PORT:-7575}:7575"
    environment:
      SECRET_ENCRYPTION_KEY: "${SECRET_ENCRYPTION_KEY:?Run setup.sh to create the persistent encryption key}"
      TZ: "${TZ:-Etc/UTC}"
    volumes:
      - homarr-data:/appdata
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7575').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5

volumes:
  homarr-data:
