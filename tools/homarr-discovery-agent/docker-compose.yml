services:
  homarr-discovery-agent:
    build: .
    restart: unless-stopped
    pid: host
    environment:
      HOMARR_URL: ${HOMARR_URL:?set HOMARR_URL in .env}
      HOMARR_DISCOVERY_TOKEN: ${HOMARR_DISCOVERY_TOKEN:?set HOMARR_DISCOVERY_TOKEN in .env}
      DISCOVERY_RESOURCE_ID: ${DISCOVERY_RESOURCE_ID:?set DISCOVERY_RESOURCE_ID in .env}
      DISCOVERY_NAME: ${DISCOVERY_NAME:?set DISCOVERY_NAME in .env}
      DISCOVERY_TYPE: ${DISCOVERY_TYPE:-qemu}
      DISCOVERY_INTERVAL: ${DISCOVERY_INTERVAL:-60s}
      DISCOVERY_ADDRESS: ${DISCOVERY_ADDRESS:-}
      DISCOVERY_WEB_SERVICES: ${DISCOVERY_WEB_SERVICES:-}
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
