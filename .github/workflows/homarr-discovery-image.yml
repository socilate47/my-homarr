name: Build Homarr discovery image

on:
  push:
    branches:
      - homarr-discovery
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./tooling/github/setup
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Check agent
        working-directory: tools/homarr-discovery-agent
        run: go test ./... && go vet ./...
      - name: Check installer syntax
        run: bash -n tools/homarr-discovery-agent/install-agent.sh
      - name: Check affected workspace types
        run: pnpm exec turbo typecheck --filter=@homarr/nextjs --filter=@homarr/api --filter=@homarr/cron-jobs --filter=@homarr/db --filter=@homarr/server-settings --filter=@homarr/validation --filter=@homarr/forms-collection --filter=@homarr/icons
      - name: Run discovery and media regression tests
        env:
          CI: "true"
          NODE_ENV: development
        run: pnpm exec vitest run packages/db/test/discovery/discovery.spec.ts packages/api/src/router/test/discovery.spec.ts packages/validation/src/test/media.spec.ts

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:discovery
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=homarr-discovery
          cache-to: type=gha,mode=max,scope=homarr-discovery
          secrets: |
            TURBO_API=${{ secrets.TURBO_API }}
            TURBO_TEAM=${{ secrets.TURBO_TEAM }}
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
            TURBO_REMOTE_CACHE_SIGNATURE_KEY=${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
