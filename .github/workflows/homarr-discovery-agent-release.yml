name: Build discovery agent

on:
  workflow_dispatch:
  push:
    tags:
      - "discovery-agent-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache: false
      - name: Build binaries
        working-directory: tools/homarr-discovery-agent
        run: |
          go test ./...
          go vet ./...
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/homarr-discovery-agent-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/homarr-discovery-agent-linux-arm64 .
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: homarr-discovery-agent
          path: tools/homarr-discovery-agent/dist/
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/discovery-agent-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tools/homarr-discovery-agent/dist/homarr-discovery-agent-linux-amd64
            tools/homarr-discovery-agent/dist/homarr-discovery-agent-linux-arm64
          generate_release_notes: true
